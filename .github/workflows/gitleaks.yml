name: Gitleaks

# landr-0unqx.1: full-history secret scan on every dev-bound PR and every push to dev.
# Pinned gitleaks binary + sha256 check (scripts/ci-gitleaks.sh), NOT gitleaks-action
# (needs a paid licence for orgs). Benign historical findings are baselined in
# .gitleaksignore / .gitleaks.toml; anything new fails the job.
# Public repo; ubuntu-latest is this repo's only lane (docs/agents/ci-runners.md).
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan
        run: scripts/ci-gitleaks.sh history
