name: dependency-audit

# landr-0unqx.2: osv-scanner over the lockfile(s), HIGH/CRITICAL
# (CVSS >= 7.0) advisories not listed in the checked-in osv-scanner.toml.
#
# A new advisory can be published at any time, so a PR must not go red for a
# finding it did not cause. Therefore:
#   * pull_request: scan the base lockfile and the head lockfile; FAIL only on
#     findings that are new in head (the PR added or changed a vulnerable
#     dependency). Pre-existing findings are reported as warnings.
#   * schedule (daily) / workflow_dispatch / push: report only (never red for
#     findings), and for schedule/dispatch the `bump` job upgrades the
#     affected packages on dev, runs the repo gate and opens or updates ONE PR
#     `deps: security bumps` from branch deps/security-bumps.
# Note: schedule and workflow_dispatch run the workflow file on the default
# branch (main); the jobs check out `dev` explicitly.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  LOCKFILES: 'package-lock.json'

jobs:
  osv-scan:
    name: osv-scanner (HIGH/CRITICAL gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.report.outputs.count }}
      packages: ${{ steps.report.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # schedule/dispatch run on the default branch; audit what ships next.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'dev' }}

      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan head lockfiles
        run: |
          set +e -uo pipefail
          args=()
          for f in $LOCKFILES; do args+=(-L "$f"); done
          # exit 1 = vulnerabilities found (judged by the next steps); >1 = scanner error
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --format json \
            "${args[@]}" > "$RUNNER_TEMP/osv-head.json" 2> "$RUNNER_TEMP/osv.err"
          rc=$?
          cat "$RUNNER_TEMP/osv.err" >&2
          if [ "$rc" -gt 1 ]; then echo "osv-scanner failed (exit $rc)"; exit "$rc"; fi
          # The table (all severities) is informational.
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml "${args[@]}" || true

      - name: Report HIGH/CRITICAL (non-blocking)
        id: report
        run: python3 .github/scripts/osv_gate.py report "$RUNNER_TEMP/osv-head.json"

      - name: Scan base lockfiles (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e -uo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base"
          args=()
          for f in $LOCKFILES; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/base/$f"
              args+=(-L "$RUNNER_TEMP/base/$f")
            fi
          done
          if [ "${#args[@]}" -eq 0 ]; then echo '{"results":[]}' > "$RUNNER_TEMP/osv-base.json"; exit 0; fi
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --format json \
            "${args[@]}" > "$RUNNER_TEMP/osv-base.json" 2> "$RUNNER_TEMP/osv.err"
          rc=$?
          cat "$RUNNER_TEMP/osv.err" >&2
          if [ "$rc" -gt 1 ]; then echo "osv-scanner failed on base (exit $rc)"; exit "$rc"; fi

      - name: Gate on findings new in this PR
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/osv_gate.py new "$RUNNER_TEMP/osv-head.json" "$RUNNER_TEMP/osv-base.json"

  bump:
    name: security bump PR
    needs: osv-scan
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.osv-scan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      PACKAGES: ${{ needs.osv-scan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Bump the affected packages
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            npm update "$pkg" || echo "::warning::npm update $pkg failed"
          done
          git diff --stat -- package.json package-lock.json
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile unchanged: no patched version resolvable by an in-range update."
            echo "::warning::Security findings remain but an in-range bump changed nothing; a manual major bump is needed."
            echo "CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Repo gate
        if: env.CHANGED == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: 'Open or update the deps: security bumps PR'
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=deps/security-bumps
          git config user.name "landr-bot"
          git config user.email "landr-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add package.json package-lock.json
          git commit -m "deps: security bumps" -m "Bumped by the daily dependency-audit run: $PACKAGES"
          git push --force origin "$branch"
          body="Automated by the daily dependency-audit workflow. Bumped to clear HIGH/CRITICAL osv-scanner findings: $PACKAGES. The repo gate passed on this branch before the push."
          if gh pr list --head "$branch" --base dev --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --base dev --head "$branch" --title "deps: security bumps" --body "$body"
          fi
