name: E2E smoke (widget)

# landr-t0do: deliberately tiny — ONE Playwright flow (booking-submit happy
# path) against the live dev stack (bw-dev.landr.de + api-dev.landr.de),
# using para42's seeded widget token. Non-blocking: this job's failure must
# never gate deploy.yml — it's a regression *signal*, not a merge gate, and
# the dev stack it hits is a live shared environment outside this repo's
# control (see .beads/scratch/handoffs/landr-t0do.md for what "green" here
# actually depends on).
on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # landr-r6e5x.1 (2026-09-11): NOT gated behind ALLOW_GITHUB_RUNNERS, unlike
  # every other repo's ubuntu-latest fallback tier — this is deliberate, not
  # an oversight. There is no self-hosted runner registered for
  # landr-booking-widget at all (verified via `gh api
  # repos/.../landr-booking-widget/actions/runners` — empty), so
  # ubuntu-latest is this workflow's ONLY lane, not a fallback in a cascade.
  # Gating it behind a variable that's unset by default would silently kill
  # this signal entirely rather than opt out of a redundant one. See the
  # landr-r6e5x.1 handoff for the option to provision a self-hosted widget
  # runner if that's ever wanted; until then, leave this as-is.
  widget-booking-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 2026-09-04: `continue-on-error: true` REMOVED. It sat on the only job in
    # this workflow, so the whole run concluded `success` even when the job
    # failed — this job failed 4 runs straight (33823233122 onward, after being
    # green through 33819434465 at 2026-09-03T23:52Z) with CI reporting green.
    # It was redundant for its stated purpose: this is a separate top-level
    # workflow, so a failure here cannot gate deploy.yml regardless. It also
    # cannot block a merge — `dev` on this repo is unprotected (the branch
    # protection API returns 404), so there are no required status checks.
    # The signal stays a regression *signal*, as the header says; it is simply
    # visible again instead of being swallowed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      - name: Run e2e (booking-submit smoke + calendar layout on WebKit/Chromium mobile)
        env:
          # Defaults (playwright.config.ts) already point at the public dev
          # deployments — override here only if that ever needs to change.
          WIDGET_BASE_URL: https://bw-dev.landr.de
          # landr-uzb1o.5: the token used to be hardcoded here — in a PUBLIC repo.
          # It now comes from the WIDGET_TOKEN repo secret. Fork PRs get no
          # secrets, so there the step is skipped with a warning instead of
          # failing on a missing token.
          WIDGET_TOKEN: ${{ secrets.WIDGET_TOKEN }}
        run: |
          if [ -z "$WIDGET_TOKEN" ]; then
            echo "::warning::WIDGET_TOKEN secret unavailable (fork PR?) - e2e smoke skipped"
            exit 0
          fi
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widget-e2e-smoke-report
          path: playwright-report/
          retention-days: 7
