name: Deploy widget to Cloudflare Pages

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      # landr-imrd: name the environment after the tier actually being
      # deployed, not a blanket 'production' — pushes to dev/staging were
      # previously recorded as GitHub Deployments into an environment
      # literally named 'production'. push events resolve to their branch
      # tier (main -> production, staging -> staging, dev -> dev); anything
      # else (PR, workflow_dispatch) keeps the prior 'preview' behavior.
      name: ${{ github.event_name != 'push' && 'preview' || github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # landr-y3oj.2 — contracts drift: regenerate src/types/api.gen.ts from
      # the committed contracts/openapi.json (a synced copy of landr-api's
      # openapi.json) and fail if it doesn't match what's checked in. Fast
      # (no DB/network) — see landr-api README "Contracts codegen" section.
      - name: Verify generated API contracts are current
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/types/api.gen.ts contracts/openapi.json

      # landr-0ji4.2 — TypeScript strict-mode ratchet: tsconfig.app.json
      # deliberately stays non-strict (see npm run typecheck above), but this
      # runs the same project with --strict and fails only if the error
      # count exceeds the checked-in strict-baseline.json. See README
      # "TypeScript strict ratchet" section for the shrink-on-touch rule.
      - name: TypeScript strict ratchet
        run: npm run typecheck:strict

      - name: Pick project + API base per branch
        id: env
        env:
          SUPABASE_URL_PROD: ${{ secrets.VITE_SUPABASE_URL_PROD }}
          SUPABASE_ANON_PROD: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
          SUPABASE_URL_STAGING: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          SUPABASE_ANON_STAGING: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_ANON_DEV: ${{ vars.VITE_SUPABASE_ANON_KEY_DEV || secrets.VITE_SUPABASE_ANON_KEY_DEV }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "project=landr-booking-widget"                                          >> "$GITHUB_OUTPUT"
            echo "api_base=https://landr-api-service-693721943357.europe-west3.run.app"  >> "$GITHUB_OUTPUT"
            echo "production_branch=main"                                                >> "$GITHUB_OUTPUT"
            echo "supabase_url=${SUPABASE_URL_PROD:-https://supabase.landr.de}"          >> "$GITHUB_OUTPUT"
            echo "supabase_anon=${SUPABASE_ANON_PROD}"                                   >> "$GITHUB_OUTPUT"
            echo "deploy_tier=prod"                                                       >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "project=landr-booking-widget-staging"                                  >> "$GITHUB_OUTPUT"
            echo "api_base=https://landr-api-staging-693721943357.europe-west3.run.app"  >> "$GITHUB_OUTPUT"
            echo "production_branch=staging"                                             >> "$GITHUB_OUTPUT"
            echo "supabase_url=${SUPABASE_URL_STAGING:-https://kong.staging.landr.de}"   >> "$GITHUB_OUTPUT"
            echo "supabase_anon=${SUPABASE_ANON_STAGING}"                                >> "$GITHUB_OUTPUT"
            echo "deploy_tier=staging"                                                    >> "$GITHUB_OUTPUT"
          else
            echo "project=landr-booking-widget-dev"                                      >> "$GITHUB_OUTPUT"
            echo "api_base=https://api-dev.landr.de"                                     >> "$GITHUB_OUTPUT"
            echo "production_branch=dev"                                                  >> "$GITHUB_OUTPUT"
            echo "supabase_url=https://kong.dev.landr.de"                                >> "$GITHUB_OUTPUT"
            echo "supabase_anon=${SUPABASE_ANON_DEV}"                                    >> "$GITHUB_OUTPUT"
            echo "deploy_tier=dev"                                                        >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ steps.env.outputs.api_base }}
          VITE_SUPABASE_URL: ${{ steps.env.outputs.supabase_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.env.outputs.supabase_anon }}
          VITE_USE_MOCKS: '0'
          # landr-7dya.20: inject deploy tier so TierBadge renders in dev/staging iframes
          VITE_DEPLOY_TIER: ${{ steps.env.outputs.deploy_tier }}
        run: npm run build

      - name: Ensure Cloudflare Pages project exists (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "${{ steps.env.outputs.project }}" \
            --production-branch=${{ steps.env.outputs.production_branch }} 2>&1 \
            | tee /tmp/pages-create.log \
            || grep -qi "already exists" /tmp/pages-create.log

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=${{ steps.env.outputs.project }}
            --branch=${{ github.head_ref || github.ref_name }}
