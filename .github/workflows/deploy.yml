name: Deploy widget to Cloudflare Pages

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  # landr-3a8mh.1: OIDC token for the Firebase Hosting deploy (WIF, no stored key).
  id-token: write

# landr-uzb1o.5: serialize prod deploys (never cancel one mid-flight); every
# other ref/PR gets its own group so previews are not queued behind prod.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-prod-landr-booking-widget' || format('deploy-landr-booking-widget-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # landr-r6e5x.1 (2026-09-11): NOT gated behind ALLOW_GITHUB_RUNNERS, unlike
  # every other repo's ubuntu-latest fallback tier — deliberate, not an
  # oversight. No self-hosted runner is registered for
  # landr-booking-widget at all (verified via `gh api
  # repos/.../landr-booking-widget/actions/runners` — empty), so
  # ubuntu-latest is this workflow's ONLY lane, not a fallback in a cascade.
  # This is also the repo's dev/staging/prod DEPLOY job — gating it behind a
  # variable unset by default would stop every widget deploy outright with
  # no fallback path. See the landr-r6e5x.1 handoff for the option to
  # provision a self-hosted widget runner if that's ever wanted.
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # landr-imrd: name the environment after the tier actually being
      # deployed, not a blanket 'production' — pushes to dev/staging were
      # previously recorded as GitHub Deployments into an environment
      # literally named 'production'. push events resolve to their branch
      # tier (main -> production, staging -> staging, dev -> dev); anything
      # else (PR, workflow_dispatch) keeps the prior 'preview' behavior.
      name: ${{ github.event_name != 'push' && 'preview' || github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history on main: the prod guard below walks first-parent ancestry.
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}

      - name: Guard — main tip must be the release console's staging→main promotion
        # landr-uzb1o.22. GitHub Free has no branch protection, so a direct push
        # to main would otherwise deploy untested code. Pure git, runs before any
        # step that holds a Cloudflare credential. Accepted commit shapes are
        # documented in scripts/ci-prod-deploy-guard.sh.
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --quiet origin staging
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "::error::checked-out HEAD is not the pushed commit"; exit 1; }
          bash scripts/ci-prod-deploy-guard.sh git-shape

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # landr-y3oj.2 — contracts drift: regenerate src/types/api.gen.ts from
      # the committed contracts/openapi.json (a synced copy of landr-api's
      # openapi.json) and fail if it doesn't match what's checked in. Fast
      # (no DB/network) — see landr-api README "Contracts codegen" section.
      - name: Verify generated API contracts are current
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/types/api.gen.ts contracts/openapi.json

      - name: Pick project + API base per branch
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "project=landr-booking-widget"                                          >> "$GITHUB_OUTPUT"
            echo "api_base=https://landr-api-service-693721943357.europe-west3.run.app"  >> "$GITHUB_OUTPUT"
            echo "production_branch=main"                                                >> "$GITHUB_OUTPUT"
            echo "deploy_tier=prod"                                                       >> "$GITHUB_OUTPUT"
            echo "firebase_site=landr-bw"                                                 >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "project=landr-booking-widget-staging"                                  >> "$GITHUB_OUTPUT"
            echo "api_base=https://landr-api-staging-693721943357.europe-west3.run.app"  >> "$GITHUB_OUTPUT"
            echo "production_branch=staging"                                             >> "$GITHUB_OUTPUT"
            echo "deploy_tier=staging"                                                    >> "$GITHUB_OUTPUT"
            echo "firebase_site=landr-bw-staging"                                         >> "$GITHUB_OUTPUT"
          else
            echo "project=landr-booking-widget-dev"                                      >> "$GITHUB_OUTPUT"
            echo "api_base=https://api-dev.landr.de"                                     >> "$GITHUB_OUTPUT"
            echo "production_branch=dev"                                                  >> "$GITHUB_OUTPUT"
            echo "deploy_tier=dev"                                                        >> "$GITHUB_OUTPUT"
            echo "firebase_site=landr-bw-dev"                                             >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ steps.env.outputs.api_base }}
          VITE_USE_MOCKS: '0'
          # landr-7dya.20: inject deploy tier so TierBadge renders in dev/staging iframes
          VITE_DEPLOY_TIER: ${{ steps.env.outputs.deploy_tier }}
        run: npm run build

      # landr-tkgx8.2: per-tier API base for functions/_middleware.ts (splash logo).
      - name: Write edge function config
        run: echo '{"apiBase":"${{ steps.env.outputs.api_base }}"}' > functions/_config.json

      # landr-3a8mh.1: Firebase Hosting (Google IPs) is the primary host for
      # bw*.landr.de — Spanish ISPs null-route shared Cloudflare IPs on LaLiga
      # match days. CF Pages below stays deployed as the warm standby (rollback
      # = point the DNS record back at <project>.pages.dev). Push-only: PRs keep
      # CF preview URLs. Off until FIREBASE_HOSTING_ENABLED is set, i.e. until
      # the sites + WIF SAs exist (scripts/bw-firebase-provision.sh, meta-repo).
      # Runs before CF so a failing primary fails the job before the standby moves.
      # Own WIF pool (github-widget): the landr-api pool binds its SAs by ref alone,
      # so this public repo must never get a provider in that pool.
      - name: Authenticate with Google Cloud (OIDC, Firebase Hosting)
        if: github.event_name == 'push' && vars.FIREBASE_HOSTING_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/693721943357/locations/global/workloadIdentityPools/github-widget/providers/github-actions
          service_account: bw-deploy-${{ steps.env.outputs.deploy_tier }}@landr-de.iam.gserviceaccount.com

      - name: Publish to Firebase Hosting
        if: github.event_name == 'push' && vars.FIREBASE_HOSTING_ENABLED == 'true'
        run: |
          jq --arg site "${{ steps.env.outputs.firebase_site }}" '.hosting.site = $site' firebase.json > /tmp/firebase.json
          mv /tmp/firebase.json firebase.json
          npx --yes firebase-tools@15.32.1 deploy --only hosting --project landr-de \
            --non-interactive --message "${{ github.ref_name }} ${{ github.sha }}"

      - name: Ensure Cloudflare Pages project exists (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "${{ steps.env.outputs.project }}" \
            --production-branch=${{ steps.env.outputs.production_branch }} 2>&1 \
            | tee /tmp/pages-create.log \
            || grep -qi "already exists" /tmp/pages-create.log

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=${{ steps.env.outputs.project }}
            --branch=${{ github.head_ref || github.ref_name }}
