# landr-uzb1o.5: keep the SHA-pinned `uses:` refs in .github/workflows current.
# Dependabot bumps the pinned SHA and the trailing `# vX.Y.Z` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  # landr-0unqx.2: security-only. open-pull-requests-limit 0 disables routine
  # version-update PRs; GitHub security updates (repo setting) still open PRs
  # for vulnerable deps, grouped, against dev.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
